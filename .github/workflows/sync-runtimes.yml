name: Sync Runtime Catalog

on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Sync runtime catalog
        id: sync
        run: |
          output=$(go run ./tools/sync-catalog/)
          echo "$output"
          bench_url=$(echo "$output" | grep "^LLAMA_BENCH_URL=" | tail -1 | cut -d= -f2-)
          echo "bench_url=$bench_url" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: Download and extract llama-bench
        if: steps.sync.outputs.bench_url != ''
        run: |
          mkdir -p /tmp/bench
          curl -fL "${{ steps.sync.outputs.bench_url }}" -o /tmp/bench/llama.tar.gz
          if [[ "${{ steps.sync.outputs.bench_url }}" == *.zip ]]; then
            sudo apt-get update && sudo apt-get install -y unzip
            unzip -o /tmp/bench/llama.tar.gz -d /tmp/bench
          else
            tar -xzf /tmp/bench/llama.tar.gz -C /tmp/bench
          fi
          BENCH_PATH=$(find /tmp/bench -type f -name 'llama-bench' | head -n 1)
          if [[ -z "$BENCH_PATH" ]]; then
            echo "llama-bench not found in extracted asset" >&2
            exit 1
          fi
          chmod +x "$BENCH_PATH"
          echo "NPU_OPTIMIZE_LLAMA_BENCH=$BENCH_PATH" >> "$GITHUB_ENV"

      - name: Download proxy model
        if: steps.sync.outputs.bench_url != ''
        run: |
          mkdir -p /tmp/proxy
          curl -fL "https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf" -o /tmp/proxy/proxy.gguf
          echo "NPU_OPTIMIZE_PROXY_MODEL=/tmp/proxy/proxy.gguf" >> "$GITHUB_ENV"

      - name: Run integration tests
        if: steps.sync.outputs.bench_url != ''
        run: |
          go test -tags=integration ./internal/llamabench -v -count=1

      - name: Commit if changed
        run: |
          if ! git diff --exit-code docs/runtime-catalog.json; then
            git config user.name "npu-optimize bot"
            git config user.email "bot@npu-optimize.dev"
            git add docs/runtime-catalog.json
            git commit -m "chore: sync runtime catalog ($(date +%Y-%m-%d))"
            git push
          else
            echo "no changes"
          fi
